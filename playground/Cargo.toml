[package]
name = "celso-playground"
version = "0.1.0"
edition = "2024"
publish = false
description = "celso をブラウザで動かす playground (wasm-bindgen)"

# celso 本体とは別のワークスペースにする (ネイティブ専用の依存を持ち込まないため)
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
# Zig コア・MLM を外し、純 Rust の分かち書きだけを使う
celso = { path = "..", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# wasm-bindgen CLI (0.2.129) と版をそろえる
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
