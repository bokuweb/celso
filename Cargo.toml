[package]
name = "celso"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bincode = "2"
candle-core = "0.9.2"
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
clap = { version = "4.6.7", features = ["derive"] }
delarocha = { version = "0.1.1", features = ["zig-ffi"] }
memchr = "2"
memmap2 = "0.9.11"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
unicode-normalization = "0.1.25"
xorf = { version = "0.11", features = ["bincode"] }

# macOS では Accelerate (BLAS) で MLM の行列積を速くする
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9.2", features = ["accelerate", "metal"] }
candle-nn = { version = "0.9.2", features = ["accelerate", "metal"] }
candle-transformers = { version = "0.9.2", features = ["accelerate", "metal"] }
