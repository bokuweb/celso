[package]
name = "celso"
version = "0.1.0"
edition = "2024"

# 既定 (native) は Zig コアの分かち書きと MLM を使う。ブラウザ向け (playground/) は
# `default-features = false` で、純 Rust の分かち書き (IPADIC の生ファイルから辞書を作る) だけを使う。
[features]
default = ["native"]
native = ["zig", "mlm", "ngset"]
zig = ["delarocha/zig-ffi"]
mlm = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
# 研究用の存在フィルタ (修正案なし版)。配布構成では使わない
ngset = ["dep:xorf", "dep:bincode"]

[[bin]]
name = "celso"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
anyhow = "1.0.104"
bincode = { version = "2", optional = true }
candle-core = { version = "0.9.2", optional = true }
candle-nn = { version = "0.9.2", optional = true }
candle-transformers = { version = "0.9.2", optional = true }
clap = { version = "4.6.7", features = ["derive"] }
delarocha = { version = "0.1.1" }
memchr = "2"
memmap2 = "0.9.11"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"], optional = true }
unicode-normalization = "0.1.25"
xorf = { version = "0.11", features = ["bincode"], optional = true }

# macOS では Accelerate (BLAS) で MLM の行列積を速くする
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9.2", features = ["accelerate", "metal"], optional = true }
candle-nn = { version = "0.9.2", features = ["accelerate", "metal"], optional = true }
candle-transformers = { version = "0.9.2", features = ["accelerate", "metal"], optional = true }
